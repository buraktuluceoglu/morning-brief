name: Daily Morning Brief

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 08:00 Turkey (UTC+3)
  workflow_dispatch:        # manual trigger for testing

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run morning brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: Commit vault update
        run: |
          git config user.name "morning-brief[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault/sent_urls.json
          git diff --staged --quiet || git commit -m "chore: vault $(date -u +%Y-%m-%d)"
          git push
